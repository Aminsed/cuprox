[pytest]
testpaths = tests/python
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Deliberately no `pythonpath = python`.
#
# That line put the source tree ahead of the installed package, so `import
# cuprox` found python/cuprox/ -- which contains no compiled _core. Every test
# therefore ran against the scipy fallback, which is why a 255-test suite
# reported green while the CUDA path was entirely non-functional. Tests now run
# against the installed artefact: `pip install .` first.

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU hardware
    benchmark: marks benchmark tests
    integration: marks integration tests

# Options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning:scipy.*
    ignore::PendingDeprecationWarning
    ignore::UserWarning:cuprox.*
