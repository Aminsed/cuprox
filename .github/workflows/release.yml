name: release

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication is PyPI Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this workflow and PyPI verifies it. No API token is stored in the
# repository, so there is nothing to leak or rotate.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Verify the sdist actually carries the sources
        # cuProx ships source-only: pip compiles the CUDA extension on the
        # target machine, so a complete sdist is load-bearing.
        run: |
          set -euo pipefail
          # Listed once into a file rather than piped per-file: `tar | grep -q`
          # makes grep exit on its first match, tar dies of SIGPIPE, and
          # pipefail then reports the whole check as a failure.
          tar tzf dist/*.tar.gz > "$RUNNER_TEMP/sdist-listing.txt"
          for f in CMakeLists.txt src/bindings/module.cpp \
                   src/cuprox/solvers/admm.cu src/cuprox/solvers/pdhg.cu \
                   src/cuprox/preprocess/scaling.cu \
                   python/cuprox/__init__.py python/cuprox/_version.py; do
            grep -q "/$f$" "$RUNNER_TEMP/sdist-listing.txt" \
              || { echo "::error::sdist is missing $f"; exit 1; }
          done
          echo "sdist contains every file needed to build"

      - name: Refuse to publish a wheel with no compiled extension
        # The 0.1.0 release on PyPI was a py3-none-any wheel: it imported
        # cleanly and then failed on every solve, because the CUDA core was
        # never in it. pip prefers a wheel over an sdist, so shipping one by
        # accident hides the working source build from every user.
        run: |
          set -euo pipefail
          if ls dist/*.whl >/dev/null 2>&1; then
            echo "::error::a wheel was built; this project publishes sdist only"
            exit 1
          fi
          echo "sdist-only, as intended"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: sdist
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
