name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Fast checks - run first, fail fast
  # ============================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install linters
        run: pip install ruff black
        
      - name: Check formatting with Black
        run: black --check --diff python/ tests/python/
        
      - name: Lint with Ruff
        run: ruff check python/ tests/python/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install mypy numpy scipy
          pip install types-setuptools
          
      - name: Run mypy
        run: mypy python/cuprox --ignore-missing-imports --disable-error-code=no-any-return --disable-error-code=no-untyped-def
        continue-on-error: true  # Don't fail CI yet, building up types

  # ============================================================
  # Tests - CPU only (no GPU on GitHub free tier)
  # ============================================================
  test-cpu:
    name: Test (CPU fallback, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy pytest pytest-cov
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
      # CPU-only build. GitHub runners have no GPU, so this exercises the scipy
      # fallback, not the CUDA kernels. That distinction matters: CI previously
      # installed `python/` alone, which never built the extension, so a green
      # run said nothing at all about the solver. Kernel correctness is covered
      # by the GPU job below and by tests/cpp.
      - name: Install cuprox (CPU fallback build)
        run: |
          pip install "scikit-build-core>=0.10" "pybind11>=2.12" cmake
          CMAKE_ARGS="-DCUPROX_CPU_ONLY=ON" pip install --no-build-isolation -e ".[dev]" || pip install --no-build-isolation -e .

      - name: Confirm this really is the fallback
        run: |
          python - <<'PY'
          import cuprox
          assert cuprox.__cuda_available__ is False, "CI runner unexpectedly has CUDA"
          print("cuprox", cuprox.__version__, "- CPU fallback, as expected")
          PY

      - name: Run tests
        run: |
          pytest tests/python -v -m "not gpu" --tb=short
          
      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          # No fail-under here. This job deliberately runs only the
          # solver-independent suites, so its coverage number reflects that and
          # nothing else. Meaningful coverage needs a GPU runner.
          pytest tests/python -v -m "not gpu" --cov=cuprox --cov-report=xml --cov-fail-under=0
          
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Build check - verify package builds locally
  # ============================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test-cpu]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install build tools
        run: pip install build
        
      - name: Build sdist
        run: python -m build --sdist
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================
  # GPU Tests - requires self-hosted runner with GPU
  # Disabled by default - uncomment and set up self-hosted runner
  # ============================================================
  # test-gpu:
  #   name: Test (GPU)
  #   runs-on: [self-hosted, gpu]
  #   needs: [lint]
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   
  #   steps:
  #     - uses: actions/checkout@v4
  #     
  #     - name: Check CUDA
  #       run: nvidia-smi
  #       
  #     - name: Install dependencies
  #       run: |
  #         pip install numpy scipy pytest
  #         pip install -e .
  #         
  #     - name: Run all tests
  #       run: pytest tests/python -v --tb=short

  # ============================================================
  # Summary job for branch protection
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test-cpu, build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.test-cpu.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed"
            exit 1
          fi
          echo "All checks passed!"

  cuda-build:
    name: CUDA compile (${{ matrix.cuda }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4.1", "11.8.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev", "cccl"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev", "libcusparse", "libcusparse-dev"]'
      # The toolkit action does not reliably place libnvJitLink, which cuSPARSE
      # 12 needs at link time. Install it straight from the NVIDIA repo the
      # action already configured.
      - name: Install nvJitLink (CUDA 12 only)
        if: startsWith(matrix.cuda, '12.')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnvjitlink-12-4 || true
          ldconfig -p | grep -i nvjitlink || find /usr/local/cuda* -name 'libnvJitLink*' 2>/dev/null | head

      - name: Configure
        env:
          CUDAARCHS: "70;80;86"
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCUPROX_BUILD_TESTS=ON -DCUPROX_BUILD_PYTHON=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-L$CUDA_PATH/targets/x86_64-linux/lib ${{ matrix.linkflags }}"
      - name: Build
        run: cmake --build build -j
