# ============================================================================
# cuProx - GPU-Accelerated First-Order LP/QP Solver
# ============================================================================

[build-system]
requires = [
    "scikit-build-core>=0.10",
    # 2.12 is the floor: earlier releases return stride-0 arrays under NumPy 2,
    # which silently turned every solution vector into x[0] repeated.
    "pybind11>=2.12",
    "numpy>=1.20",
]
build-backend = "scikit_build_core.build"

# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "cuprox"
dynamic = ["version"]
description = "GPU-accelerated LP/QP optimization solver using first-order proximal methods"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Amin Sedaghat", email = "amin32846@gmail.com"}
]
maintainers = [
    {name = "Amin Sedaghat", email = "amin32846@gmail.com"}
]
keywords = [
    "optimization",
    "linear-programming",
    "quadratic-programming",
    "gpu",
    "cuda",
    "machine-learning",
    "operations-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=2.0",
    "sphinxcontrib-napoleon>=0.7",
]
benchmark = [
    "gurobipy>=10.0",
    "osqp>=0.6",
    "cvxpy>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.7",
]
torch = [
    "torch>=2.0",
]
all = [
    "cuprox[dev,docs,benchmark,torch]",
]

[project.urls]
Homepage = "https://github.com/Aminsed/cuprox"
Documentation = "https://github.com/Aminsed/cuprox#readme"
Repository = "https://github.com/Aminsed/cuprox"
Issues = "https://github.com/Aminsed/cuprox/issues"

# ============================================================================
# scikit-build-core Configuration
# ============================================================================

[tool.scikit-build.metadata.version]
# One source of truth. The version previously lived in both
# pyproject.toml and python/cuprox/__init__.py, which is one too many.
provider = "scikit_build_core.metadata.regex"
input = "python/cuprox/_version.py"

[tool.scikit-build]
cmake.build-type = "Release"
# Matches cmake_minimum_required in CMakeLists.txt. Without this,
# scikit-build-core is free to use a system cmake that is too old to configure
# the project -- Ubuntu 22.04 still ships 3.22.
cmake.version = ">=3.24"
build.verbose = false
minimum-version = "0.10"
wheel.packages = ["python/cuprox"]
wheel.license-files = ["LICENSE"]
sdist.include = [
    "src/**",
    "tests/**",
]

[tool.scikit-build.cmake.define]
CUPROX_BUILD_TESTS = "OFF"
CUPROX_BUILD_PYTHON = "ON"
CUPROX_BUILD_BENCHMARKS = "OFF"

# Ruff is configured in ruff.toml, which takes precedence over anything
# written here. Keeping a second copy in this file only creates a version
# that looks authoritative and is silently ignored.

# ============================================================================
# Black (Formatting)
# ============================================================================

[tool.black]
target-version = ["py39", "py310", "py311", "py312"]
line-length = 100

# ============================================================================
# MyPy (Type Checking)
# ============================================================================

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "cuprox._core",
]
ignore_missing_imports = true

# pytest is configured in pytest.ini, which takes precedence over anything
# written here.

# ============================================================================
# Coverage Configuration
# ============================================================================

[tool.coverage.run]
source = ["python/cuprox"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 50
show_missing = true
